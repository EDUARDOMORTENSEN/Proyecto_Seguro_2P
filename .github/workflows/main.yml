name: DevSecOps Dev->Test->Main Pipeline

# ──────────────────────────────────────────────────────────────────────────────
# TRIGGER:
#   • Push         → rama 'dev'   : crea un PR automático dev → test (si hay PAT)
#   • Pull Request → rama 'test'  : ejecuta toda la cadena (nodos 1-5)
#
# Este pipeline es AUTOCONTENIDO: no necesita cuentas externas.
#   - El microservicio ML se levanta dentro del runner.
#   - La imagen Docker se publica en GitHub Container Registry (ghcr.io).
#   - El despliegue se valida en un entorno de staging con smoke tests.
# Secrets OPCIONALES: PAT_AUTOMATION, TELEGRAM_TOKEN, TELEGRAM_CHAT_ID,
#                     RENDER_DEPLOY_HOOK_URL
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - test

env:
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

jobs:

  # ============================================================================
  # NODO 0: CREACIÓN AUTOMÁTICA DE PR (dev → test)
  # ============================================================================
  create_pr:
    name: "Crear PR automático (dev → test)"
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear Pull Request de dev → test
        env:
          GH_TOKEN: ${{ secrets.PAT_AUTOMATION }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No hay secret PAT_AUTOMATION: abre el PR dev → test manualmente para disparar el pipeline."
            exit 0
          fi
          EXISTING_PR=$(gh pr list --base test --head dev --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Ya existe un PR abierto de dev → test: #$EXISTING_PR"
          else
            gh pr create --base test --head dev \
              --title "[CI] Merge automático dev → test" \
              --body "PR generado automáticamente por el pipeline CI/CD. Commit: ${{ github.sha }} — Autor: @${{ github.actor }}"
          fi

      - name: Notificar via Telegram
        if: success() && env.TELEGRAM_TOKEN != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="Push a dev por ${{ github.actor }} — commit ${{ github.sha }}"

  # ============================================================================
  # NODO 1: REVISIÓN DE SEGURIDAD (Modelo de Minería ML)
  # Levanta el microservicio FastAPI dentro del runner y evalúa los .java del PR.
  # ============================================================================
  security_scan:
    name: "Revisión de Seguridad (ML)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read

    steps:
      - name: Descargar código del PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: seguridad/requirements.txt

      - name: Instalar dependencias del modelo ML
        run: pip install -r seguridad/requirements.txt

      - name: Levantar microservicio ML (FastAPI) en el runner
        run: |
          cd seguridad
          nohup uvicorn api_modelo:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then echo; echo "Microservicio ML listo"; exit 0; fi
            sleep 2
          done
          cat api.log; exit 1

      - name: Ejecutar Modelo Predictivo de Seguridad
        env:
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER:      ${{ github.event.pull_request.number }}
          MODELO_API_URL: http://localhost:8000
        run: |
          cd seguridad
          python evaluar_pr.py

  # ============================================================================
  # NODO 2: PRUEBAS UNITARIAS SPRING BOOT (JUnit 5 + JaCoCo)
  # ============================================================================
  spring_boot_tests:
    name: "Pruebas JUnit 5 + Cobertura JaCoCo"
    needs: security_scan
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas unitarias y generar reporte de cobertura
        run: |
          cd backend
          chmod +x ./mvnw
          ./mvnw -B clean test -Dexcludes="**/*IntegrationTest.java"

      - name: Publicar reporte de cobertura JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  # ============================================================================
  # NODO 3: PRUEBAS DE INTEGRACIÓN (RabbitMQ + Spring Boot)
  # ============================================================================
  integration_tests:
    name: "Pruebas de Integración (RabbitMQ)"
    needs: security_scan
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas de integración
        run: |
          cd backend
          chmod +x ./mvnw
          ./mvnw -B test -Dtest="*IntegrationTest" -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false
        env:
          SPRING_RABBITMQ_HOST:     localhost
          SPRING_RABBITMQ_PORT:     5672
          SPRING_RABBITMQ_USERNAME: guest
          SPRING_RABBITMQ_PASSWORD: guest

      - name: Publicar reporte de pruebas de integración
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-report
          path: backend/target/surefire-reports/

  # ============================================================================
  # NODO 4: CONVERGENCIA — MERGE A TEST
  # ============================================================================
  merge_to_test:
    name: "Merge a Test"
    needs: [spring_boot_tests, integration_tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Merge del PR a la rama 'test'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --merge \
            --subject "[CI] Merge automático PR #${{ github.event.pull_request.number }} → test"

  # ============================================================================
  # NODO 4.5: MERGE AUTOMÁTICO TEST → MAIN
  # ============================================================================
  merge_to_main:
    name: "Merge a Main"
    needs: merge_to_test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar código de la rama main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fusionar test en main y hacer push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin test
          git merge origin/test --no-edit
          git push origin main

  # ============================================================================
  # NODO 5: CD — BUILD, PUBLICACIÓN DE IMAGEN Y DESPLIEGUE VERIFICADO
  # ============================================================================
  deploy_production:
    name: "Build Docker, Publicación y Despliegue"
    needs: merge_to_main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar código de main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y empaquetar el backend
        run: |
          cd backend
          chmod +x ./mvnw
          ./mvnw -B package -DskipTests

      - name: Definir nombre de la imagen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zonas-backend" >> "$GITHUB_ENV"

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Desplegar en entorno de staging (Postgres + RabbitMQ + backend)
        run: |
          docker network create zonas
          docker run -d --name postgres --network zonas \
            -e POSTGRES_DB=zonas_db -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=12345 postgres:16
          docker run -d --name rabbitmq --network zonas rabbitmq:3-management
          until docker exec postgres pg_isready -U postgres -d zonas_db; do sleep 2; done
          docker run -d --name backend --network zonas -p 8080:8080 \
            -e DB_URL=jdbc:postgresql://postgres:5432/zonas_db \
            -e DB_USERNAME=postgres -e DB_PASSWORD=12345 \
            -e RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672 \
            "$IMAGE:${{ github.sha }}"

      - name: Smoke tests sobre el despliegue
        run: |
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/info || true)
            if [ "$CODE" = "200" ]; then break; fi
            echo "Esperando al backend... (HTTP $CODE)"; sleep 5
          done
          echo "GET /api/v1/info"
          curl -sf http://localhost:8080/api/v1/info | tee info.json; echo
          grep -q '"UP"' info.json
          echo "GET /api/v1/zonas/"
          curl -sf http://localhost:8080/api/v1/zonas/; echo
          echo "Despliegue verificado: la aplicación responde correctamente."

      - name: Logs del backend (si falla)
        if: failure()
        run: docker logs backend || true

      - name: Disparar despliegue en Render (opcional)
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -sf -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Notificar via Telegram
        if: always() && env.TELEGRAM_TOKEN != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="Pipeline ${{ job.status }} — imagen ${IMAGE}:${{ github.sha }}"
